[project]
name = "raphael-cli"
version = "0.1.0"
description = "RAPHAEL - Local-first AI second brain for the terminal (CLI + TUI)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RAPHAEL" }]
keywords = ["ai", "second-brain", "cli", "tui", "local-first", "rag"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.60.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "numpy>=1.26.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
# Accelerated in-database KNN. Optional: RAPHAEL falls back to a NumPy
# cosine scan when the extension cannot be loaded on the host platform.
vec = ["sqlite-vec>=0.1.6"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
raphael = "raphael.cli:main"
rph = "raphael.cli:main"
raphaeld = "raphael.daemon.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raphael"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
